services:
  solana-x402-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: solana-agent-x402-intelligence:latest
    container_name: solana-x402-intelligence
    restart: unless-stopped
    ports:
      - "4020:4020"
    environment:
      - PORT=4020
      - NODE_ENV=production
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - SOLANA_NETWORK=${SOLANA_NETWORK:-solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1}
      - SOLANA_RECIPIENT_ADDRESS=${SOLANA_RECIPIENT_ADDRESS:-7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4020/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
